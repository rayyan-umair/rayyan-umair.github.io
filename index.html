<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rayyan Umair | IT Support & Cybersecurity</title>

<link rel="stylesheet" href="css/reset.css">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/terminal.css">
<link rel="stylesheet" href="css/loader.css">
<link rel="stylesheet" href="css/nodes.css">
<link rel="stylesheet" href="css/overlays.css">
</head>
<body>

<div id="app">

  <canvas id="globe"></canvas>

  <div id="terminal">
    <div id="terminal-output"></div>
    <div id="terminal-input">
      <span>&gt;</span>
      <span id="cursor"></span>
    </div>
  </div>

  <div id="loader" class="hidden">
    <div id="loader-bar"></div>
  </div>

  <div id="identity" class="hidden">
    <div class="identity-container">
      <div class="access">ACCESS GRANTED</div>
      <div class="welcome">Welcome.</div>
      <div class="connected">Connected to the system interface of</div>
      <h1 class="name">Rayyan Umair</h1>
      <div class="role">IT Support & Cybersecurity</div>
      <div class="enter-interface">Click to enter interface</div>
    </div>
  </div>

  <div id="node-layer"></div>

  <div id="overlay" class="hidden">
    <div id="overlay-content"></div>
  </div>

</div>

<script type="module" src="js/boot.js"></script>
</body>
</html>
